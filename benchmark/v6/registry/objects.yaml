# ZenoBench object registry (11-24, after Katia's suggestion): every movable asset kind of v6.
#
# taxonomy: category -> subcategory -> type (the asset kind, the key) -> instance (scene object names).
# affordances: what the kind can do; each one names the goal atom that checks it in the simulator (vocabulary
#   below).  Only affordances the benchmark can verify from object state are listed: no liquid, no temperature
#   tolerance as a number, no capacity in ml.  "hold_liquid" is a semantic property of the vessel (watertight,
#   open top), used to decide which stand-ins are legal; the simulator never pours.
# attributes: hand-labelled facts.  Geometry (size, opening, depth, mass, graspability) is not written here:
#   object_registry.py reads it from annotations/assets.json, the same source the simulator spawns from.
#
# Vocabulary, kept closed (object_registry.check_vocab):
vocabulary:
  affordances:
    contain_solid: "small solids stay inside it (inside / fully_inside)"
    hold_liquid: "open watertight vessel; semantic only, nothing is poured"
    serve_food: "a person eats from it at the table"
    drink_from: "a person drinks from it"
    cover_opening: "flat rigid piece that can rest on a rim and close an opening (covered)"
    support_items: "flat top that other things rest on (on)"
    carry_multiple: "carries several items at once, moved as one"
    store_items: "a storage box or basket for putting things away"
    dispose: "rubbish goes into it"
    cook_in: "goes on the stove and heats food in it"
    scoop: "eats or stirs with it"
    wipe: "absorbs and wipes a spill (wiped)"
    write: "writes or draws"
    write_on: "is written in"
    read: "is read"
    stack_on: "something can stand on top of it in a tower (on_top_of, lower piece)"
    stack_top: "can sit on top of a tower (on_top_of, upper piece)"
    play: "a child plays with it"
    edible: "is eaten"
    drinkable: "is drunk"
    wipe_tissue: "tissues to wipe hands or a spill"
  attributes:
    material: "ceramic | glass | plastic | metal | wood | paper | fabric | food | foam | rubber | wicker | sponge"
    breakable: "breaks when dropped (glass, ceramic)"
    food_safe: "may touch food that is eaten"
    microwave_safe: "may go into the microwave (no metal)"
    stove_safe: "may sit on a hot stove"
    for_kids: "made for a child (plastic cup, toys)"
    has_handle: "has a handle"
    lidded: "comes with its own lid"

