text><text x="1703.5" y="818.5" font-family="Lato,Arial,sans-serif" font-size="13" fill="#697386" font-weight="400" text-anchor="middle">scene image + result</text><rect x="2035" y="751" width="245" height="89" rx="11" fill="#fff2f3" stroke="#f57688" stroke-width="2.2"/><text x="2157.5" y="793.5" font-family="Lato,Arial,sans-serif" font-size="18" fill="#1b2637" font-weight="700" text-anchor="middle">Verifier</text><text x="2157.5" y="818.5" font-family="Lato,Arial,sans-serif" font-size="13" fill="#697386" font-weight="400" text-anchor="middle">sense + check outcomes</text><text x="45" y="1147" font-family="Lato,Arial,sans-serif" font-size="12" fill="#697386" font-weight="700" text-anchor="middle">Each Gi is a task-specific DAG. Library relations may include conditional transitions, substitutes, and fallbacks; planning and reassessment share one VLM context.</text></svg>