# GT interface: the env_service behaviour.  Full GT objects and goal status, three
# 960 x 720 cameras with a 7.5 mm lens (about 108 x 92 deg), policy-internal recovery on,
# nested repair off, 40 calls.
execution:
  nested_repair: false
observation:
  cameras: [head, left_wrist, right_wrist]
  image_size: [720, 960]
  focal_length_mm: 7.5
  gt_objects: true
  task_status: true
limits:
  max_calls: 40
